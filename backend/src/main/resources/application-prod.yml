spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
app:
  mail-from: ${MAIL_FROM}
  web-origin: ${APP_WEB_ORIGIN}
  cookie-domain: ${APP_COOKIE_DOMAIN}
  cookie-secure: true
  jwt:
    secret: ${JWT_SECRET}
  ip-hash-salt: ${IP_HASH_SALT}
  openapi:
    public-docs: false
