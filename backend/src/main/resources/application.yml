spring:
  application:
    name: novelverse-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  mail-from: ${MAIL_FROM:noreply@novelverse.local}
  web-origin: ${APP_WEB_ORIGIN:http://localhost:3000}
  cookie-domain: ${APP_COOKIE_DOMAIN:}
  cookie-secure: ${APP_COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:novelverse}
    access-ttl: PT15M
    refresh-ttl: P30D
  ip-hash-salt: ${IP_HASH_SALT:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  storage:
    s3:
      enabled: ${S3_ENABLED:false}
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:novelverse}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
  openapi:
    public-docs: ${OPENAPI_PUBLIC_DOCS:true}
